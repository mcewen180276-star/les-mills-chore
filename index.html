<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><meta name=theme-color content="#17191e"><link rel=manifest href=manifest.json><title>Choreography V1</title><style>
*{box-sizing:border-box}body{margin:0;background:#17191e;color:#eee;font:15px system-ui}button,select,input{font:inherit;color:inherit;background:#292d35;border:1px solid #454954;border-radius:8px;padding:9px;min-width:0}button{cursor:pointer}button:hover,.active{background:#a92132}header,nav,.bar{display:flex;align-items:center;gap:6px;padding:8px}header strong{flex:1}nav{position:sticky;bottom:0;background:#20232a;justify-content:space-around}nav button{flex:1}main{display:grid;grid-template-columns:minmax(230px,32%) 1fr;gap:8px;padding:8px;height:calc(100dvh - 150px)}section{background:#20232a;border-radius:10px;min-height:0;min-width:0;display:flex;flex-direction:column;overflow:hidden}.list{overflow:auto;flex:1}.song{display:flex;gap:5px;padding:8px;border-bottom:1px solid #353942;align-items:center}.song span{flex:1;cursor:pointer;overflow-wrap:anywhere}.muted{color:#aab0bc;font-size:12px}audio{width:100%;height:42px}.paper{flex:1;overflow:auto;background:#555;touch-action:pan-x pan-y;position:relative;text-align:center}canvas{display:block;margin:auto;background:white}dialog{background:#20232a;color:white;border:1px solid #555;border-radius:12px;width:min(850px,95vw);max-height:85dvh;overflow:auto}dialog::backdrop{background:#0009}.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}.thumbs canvas{max-width:100%}.thumbs button{padding:4px}h3{margin:10px 0}#top select{flex:1}#top button{flex:1}#viewer:fullscreen{background:#20232a}#viewer:fullscreen .paper{height:90vh} .field{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.field>*{max-width:100%} @media(max-width:650px){main{display:flex;flex-direction:column;height:calc(100dvh - 150px)}#viewer{order:-1;flex:3}#music{flex:2}button,select{padding:7px;font-size:13px}} </style></head><body>
<header><strong>♫ Choreography <small class=muted>V1</small></strong><button onclick="settings()">⚙ Settings</button></header><div class=bar id=top><select id=program></select><select id=release></select><select id=playlist></select></div><main><section id=music><div class=bar><button id=album onclick="mode('album')">Album</button><button id=folder onclick="mode('folder')">Folder</button><button onclick="browseMusic()">Browse</button></div><div id=musicTitle class=bar></div><div id=songs class=list></div><div class=bar><span id=now class=muted>No track selected</span></div><audio id=audio controls preload=metadata></audio><div class=bar><button onclick="step(-1)">⏮</button><button onclick="step(1)">⏭</button><label><input type=checkbox id=repeat> Repeat</label><label><input type=checkbox id=continuous checked> Auto next</label></div></section><section id=viewer><div class=bar><button onclick="thumbnails()">▦ Pages ▾</button><button onclick="choosePDF()">PDF ▾</button><button onclick="tag()">Tag</button><button onclick="zoom(-.2)">−</button><button onclick="zoom(.2)">+</button><button onclick="full()">⛶</button></div><div class=paper id=paper><div id=empty style="padding:30px">Add your PDF and music folders in Settings to begin.</div><canvas id=pageCanvas hidden></canvas></div><div class=bar><button onclick="movePage(-1)">◀</button><span id=pageLabel style="flex:1;text-align:center">No PDF</span><button onclick="movePage(1)">▶</button><button onclick="printPages()">Print</button></div></section></main><nav><button onclick="closeDialog()">Notes</button><button onclick="planner()">Planner</button><button onclick="library()">Library</button><button onclick="browseMusic()">Music</button></nav><dialog id=modal><div class=bar><strong id=modalTitle style="flex:1"></strong><button onclick="closeDialog()">✕</button></div><div id=content></div></dialog><input hidden type=file id=picker multiple webkitdirectory><input hidden type=file id=restore accept=.json>
<script type=module>
import * as pdfjs from 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs';
pdfjs.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs';
const $=id=>document.getElementById(id), expose=o=>Object.assign(window,o), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let state=JSON.parse(localStorage.getItem('choreo-v1')||'{}');state.tags??={};state.playlists??={};state.releases??={};state.mode??='folder';let files=new Map(),db,doc=null,pdfKey='',page=1,scale=1,queue=[],current=-1,activePlaylist='',renderTask,renderSeq=0,loadSeq=0,audioURL='',kind='music';const programs=['BODYPUMP','BODYCOMBAT','BODYBALANCE','BODYJAM','BODYSTEP','BODYATTACK','RPM','SPRINT','GRIT','CORE','TONE','DANCE','STRENGTH DEVELOPMENT','BODYPUMP HEAVY','REFORMER'];
function save(){localStorage.setItem('choreo-v1',JSON.stringify(state))}function show(title,html){$('modalTitle').textContent=title;$('content').innerHTML=html;if(!$('modal').open)$('modal').showModal()}function closeDialog(){if($('modal').open)$('modal').close()}function opt(v,t=v){return `<option value="${esc(v)}">${esc(t)}</option>`}function key(f){return f.webkitRelativePath||f.name}function isPDF(k){return /\.pdf$/i.test(k)}function isMusic(k){return /\.(mp3|m4a|aac|wav|ogg|flac|opus|mp4)$/i.test(k)}function base(k){return k.split('/').pop().replace(/\.[^.]+$/,'')}function folderName(k){return k.split('/').slice(0,-1).join('/')||'Loose files'}function releaseKey(){return $('program').value+' '+$('release').value}function match(k){let p=$('program').value.replace(/\s/g,'').toLowerCase(),r=$('release').value;let s=k.toLowerCase().replace(/[ _-]/g,'');return (s.includes(p)||s.includes(p.replace('body','')))&&new RegExp('(^|\\D)'+r+'(\\D|$)').test(k)}
const req=indexedDB.open('choreo-files-v1',1);req.onupgradeneeded=()=>req.result.createObjectStore('files');req.onsuccess=()=>{db=req.result;let q=db.transaction('files').objectStore('files').openCursor();q.onsuccess=()=>{let c=q.result;if(c){files.set(c.key,c.value);c.continue()}else loadRelease()}};req.onerror=()=>alert('File storage unavailable. Reconnect folders each session.');
function store(k,v){if(db){let tx=db.transaction('files','readwrite');tx.objectStore('files').put(v,k);tx.onerror=()=>alert('Storage full or unavailable; file is available for this session only.')}}
function addFolder(t){kind=t;$('picker').value='';$('picker').click()}$('picker').onchange=async()=>{let n=0;for(let f of $('picker').files){let k=key(f);if(kind==='pdf'?!isPDF(k):!isMusic(k))continue;let rec={file:f,album:'',title:base(k),artist:'',track:0};files.set(k,rec);store(k,rec);n++}closeDialog();loadRelease();alert(n+' files added. Album metadata is read when available.');if(kind==='music')readMetadata()};
async function readMetadata(){let mod;try{mod=await import('https://cdn.jsdelivr.net/npm/music-metadata@11.0.0/+esm')}catch{return}for(let [k,v] of files){if(!isMusic(k)||v.scanned)continue;try{let m=await mod.parseBlob(v.file,{skipCovers:true});Object.assign(v,{album:m.common.album||'',title:m.common.title||base(k),artist:m.common.artist||'',track:m.common.track?.no||0,scanned:true});store(k,v)}catch{v.scanned=true}}if(!activePlaylist)refreshSongs()}
function init(){ $('program').innerHTML=programs.map(p=>opt(p)).join('');$('release').innerHTML=Array.from({length:200},(_,i)=>opt(i+1,'Release '+(i+1))).join('');$('program').value=state.program||'BODYCOMBAT';$('release').value=state.release||'108';updatePlaylists();$('program').onchange=$('release').onchange=()=>{activePlaylist='';$('playlist').value='';loadRelease()};$('playlist').onchange=()=>{activePlaylist=$('playlist').value;if(activePlaylist){queue=[...(state.playlists[activePlaylist]||[])];current=-1;refreshSongs(false);if(queue.length)selectSong(0,false)}else loadRelease()};mode(state.mode,false)}
function updatePlaylists(){$('playlist').innerHTML=opt('','Playlists ▾')+Object.keys(state.playlists).map(p=>opt(p)).join('');$('playlist').value=activePlaylist}
function loadRelease(){state.program=$('program').value;state.release=$('release').value;save();current=-1;refreshSongs();let k=state.releases[releaseKey()]?.pdf||[...files.keys()].find(k=>isPDF(k)&&match(k));if(k&&files.has(k))openPDF(k);else resetPDF()}
function mode(m,refresh=true){state.mode=m;save();$('album').classList.toggle('active',m==='album');$('folder').classList.toggle('active',m==='folder');if(refresh&&!activePlaylist)refreshSongs()}
function refreshSongs(rebuild=true){if(rebuild&&!activePlaylist){let link=state.releases[releaseKey()]?.[state.mode];queue=[...files.keys()].filter(k=>isMusic(k)&&(link?(state.mode==='album'?(files.get(k).album||folderName(k))===link:folderName(k)===link):match(k))).sort((a,b)=>(files.get(a).track||0)-(files.get(b).track||0)||a.localeCompare(b,undefined,{numeric:true}));} $('musicTitle').textContent=(activePlaylist||releaseKey())+' · '+queue.length+' songs';$('songs').innerHTML=queue.map((k,i)=>`<div class="song ${i===current?'active':''}"><span onclick="selectSong(${i},true)">${esc(files.get(k)?.title||base(k))}<br><small class=muted>${esc(files.get(k)?.artist||(!files.has(k)?'Reconnect file':''))}</small></span><button onclick="songMenu(${i})">⋮</button></div>`).join('')||'<div class=bar>No matching music. Browse to link an album or folder.</div>'}
async function selectSong(i,play=false){if(i<0||i>=queue.length)return;current=i;let k=queue[i],v=files.get(k);$('now').textContent=v?.title||base(k);refreshSongs(false);$('audio').pause();if(audioURL)URL.revokeObjectURL(audioURL);$('audio').removeAttribute('src');if(v){audioURL=URL.createObjectURL(v.file);$('audio').src=audioURL;if(play)$('audio').play().catch(()=>{})}let t=state.tags[k];if(t?.pdf&&files.has(t.pdf)){if(pdfKey!==t.pdf)await openPDF(t.pdf,t.pages[0]);else{page=t.pages[0];render()}}}
function step(d){if(queue.length)selectSong((current+d+queue.length)%queue.length,true)}$('audio').onended=()=>{if($('repeat').checked){$('audio').currentTime=0;$('audio').play()}else if($('continuous').checked&&current+1<queue.length)step(1)};
function resetPDF(){loadSeq++;doc=null;pdfKey='';$('pageCanvas').hidden=true;$('empty').hidden=false;$('pageLabel').textContent='No PDF'}async function openPDF(k,p=1){let seq=++loadSeq;try{let next=await pdfjs.getDocument({data:await files.get(k).file.arrayBuffer()}).promise;if(seq!==loadSeq){next.destroy();return}doc=next;pdfKey=k;page=Math.min(p,doc.numPages);scale=1;$('empty').hidden=true;$('pageCanvas').hidden=false;render()}catch(e){alert('PDF could not open: '+e.message)}}
async function render(){if(!doc)return;let seq=++renderSeq;if(renderTask){renderTask.cancel();try{await renderTask.promise}catch{}}let p=await doc.getPage(page);if(seq!==renderSeq)return;let vp=p.getViewport({scale:1});let w=Math.max(100,$('paper').clientWidth-12);let v=p.getViewport({scale:w/vp.width*scale});let c=$('pageCanvas'),d=Math.min(devicePixelRatio||1,2);c.width=v.width*d;c.height=v.height*d;c.style.width=v.width+'px';c.style.height=v.height+'px';$('pageLabel').textContent=`Page ${page} of ${doc.numPages}`;renderTask=p.render({canvasContext:c.getContext('2d'),viewport:v,transform:[d,0,0,d,0,0]});try{await renderTask.promise}catch{}}
function movePage(d){if(doc){page=Math.max(1,Math.min(doc.numPages,page+d));render()}}function zoom(d){scale=Math.max(.5,Math.min(4,scale+d));render()}function full(){if(document.fullscreenElement)document.exitFullscreen();else $('viewer').requestFullscreen?.();}document.addEventListener('fullscreenchange',()=>setTimeout(render,150));let timer;window.onresize=()=>{clearTimeout(timer);timer=setTimeout(render,200)};let touch=null;$('paper').addEventListener('touchstart',e=>{touch=e.touches.length===2?{dist:Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY),scale}:{x:e.touches[0].clientX,y:e.touches[0].clientY}},{passive:true});$('paper').addEventListener('touchmove',e=>{if(e.touches.length===2&&touch?.dist){e.preventDefault();scale=Math.max(.5,Math.min(4,touch.scale*Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY)/touch.dist));clearTimeout(timer);timer=setTimeout(render,80)}},{passive:false});$('paper').addEventListener('touchend',e=>{if(touch?.x!=null&&scale<=1&&Math.abs(e.changedTouches[0].clientX-touch.x)>65&&Math.abs(e.changedTouches[0].clientY-touch.y)<45)movePage(e.changedTouches[0].clientX<touch.x?1:-1);touch=null});
async function thumbnails(){if(!doc)return;let d=doc;show('PDF pages',`<div class=thumbs>${Array.from({length:d.numPages},(_,i)=>`<button onclick="jump(${i+1})"><canvas id="thumb${i+1}"></canvas>${i+1}</button>`).join('')}</div>`);for(let i=1;i<=d.numPages&&$('modal').open;i++){let c=$('thumb'+i);if(!c)break;let p=await d.getPage(i),v=p.getViewport({scale:100/p.getViewport({scale:1}).width});c.width=v.width;c.height=v.height;await p.render({canvasContext:c.getContext('2d'),viewport:v}).promise.catch(()=>{})}}function jump(p){page=p;closeDialog();render()}
function choosePDF(){let ks=[...files.keys()].filter(isPDF);show('Link PDF to '+releaseKey(),ks.map((k,i)=>`<div class=field><button onclick="linkPDF(${i})">${esc(k)}</button></div>`).join('')||'Add a PDF folder in Settings.');window.pdfChoices=ks}function linkPDF(i){let k=window.pdfChoices[i];(state.releases[releaseKey()]??={}).pdf=k;save();closeDialog();openPDF(k)}
function browseMusic(){let groups=[...new Set([...files.keys()].filter(isMusic).map(k=>state.mode==='album'?(files.get(k).album||folderName(k)):folderName(k)))].sort();window.groups=groups;show('Link '+state.mode+' to '+releaseKey(),`<input placeholder="Search" oninput="filterGroups(this.value)"><div id=groups>${groups.map((g,i)=>`<div class=field data-group="${esc(g.toLowerCase())}"><button onclick="linkGroup(${i})">${esc(g)}</button></div>`).join('')}</div>`)}function filterGroups(s){document.querySelectorAll('[data-group]').forEach(e=>e.hidden=!e.dataset.group.includes(s.toLowerCase()))}function linkGroup(i){(state.releases[releaseKey()]??={})[state.mode]=window.groups[i];activePlaylist='';updatePlaylists();save();closeDialog();refreshSongs()}
function tag(i=current){if(!queue[i]||!doc)return alert('Select a song and open its PDF first.');let k=queue[i],t=state.tags[k];show('Tag choreography pages',`<p>${esc(files.get(k)?.title||base(k))}</p><p>Enter page numbers separated by commas, including non-consecutive pages.</p><input id=tagPages value="${esc(t?.pdf===pdfKey?t.pages.join(','):page)}"><button onclick="saveTag(${i})">Save association</button>`)}function saveTag(i){let ps=$('tagPages').value.split(',').map(Number).filter(n=>Number.isInteger(n)&&n>0&&n<=doc.numPages);if(!ps.length)return alert('Enter valid pages.');state.tags[queue[i]]={pdf:pdfKey,pages:[...new Set(ps)]};save();closeDialog()}function songMenu(i){show('Track options',`<button onclick="tag(${i})">Tag PDF pages</button><button onclick="addToPlaylist(${i})">Add to playlist</button>`)}function addToPlaylist(i){let n=prompt('Playlist name (existing or new)');if(!n?.trim())return;(state.playlists[n.trim()]??=[]).push(queue[i]);save();updatePlaylists();closeDialog()}
function planner(){show('Playlist planner',`<div class=field><input id=newName placeholder="New playlist name"><button onclick="newPlaylist()">Create</button></div>`+Object.keys(state.playlists).map((n,i)=>`<div class=field><button onclick="editPlaylist(${i})">${esc(n)} · ${state.playlists[n].length} songs</button></div>`).join(''))}function newPlaylist(){let n=$('newName').value.trim();if(n){state.playlists[n]??=[];save();updatePlaylists();planner()}}function editPlaylist(i){let n=Object.keys(state.playlists)[i];window.editName=n;show(n,`<div class=field><button onclick="addRelease()">Add current release songs</button><button onclick="deletePlaylist()">Delete playlist</button></div>`+state.playlists[n].map((k,j)=>`<div class=song><span>${esc(files.get(k)?.title||base(k))}</span><button onclick="reorder(${j},-1)">↑</button><button onclick="reorder(${j},1)">↓</button><button onclick="removeSong(${j})">✕</button></div>`).join(''))}function editAgain(){editPlaylist(Object.keys(state.playlists).indexOf(window.editName))}function reorder(i,d){let a=state.playlists[window.editName],j=i+d;if(j>=0&&j<a.length){[a[i],a[j]]=[a[j],a[i]];save();editAgain()}}function removeSong(i){state.playlists[window.editName].splice(i,1);save();editAgain()}function addRelease(){state.playlists[window.editName].push(...queue);save();editAgain()}function deletePlaylist(){if(confirm('Delete this playlist?')){delete state.playlists[window.editName];save();updatePlaylists();planner()}}
function library(){show('Library',`<p>${[...files.keys()].filter(isPDF).length} PDFs · ${[...files.keys()].filter(isMusic).length} songs · ${Object.keys(state.tags).length} tagged songs</p><div class=field><button onclick="choosePDF()">Link release PDF</button><button onclick="browseMusic()">Link release music</button><button onclick="settings()">Manage folders</button></div>`)}function settings(){show('Settings',`<h3>Music folders</h3><div class=field><button onclick="addFolder('music')">Add / rescan music folder</button><button onclick="clearFolders('music')">Clear music folders</button></div><h3>PDF folders</h3><div class=field><button onclick="addFolder('pdf')">Add / rescan PDF folder</button><button onclick="clearFolders('pdf')">Clear PDF folders</button></div><h3>Maintenance</h3><div class=field><button onclick="clearCache()">Clear temporary cache</button><button onclick="backup()">Export backup</button><button onclick="document.getElementById('restore').click()">Restore backup</button></div><p class=muted>Folder files are copied into browser storage. Clearing folders removes these copies, not your original files or saved associations. Backups contain settings, tags and playlists, not media. Device syncing is not configured.</p><h3>Connected folders</h3>${[...new Set([...files.keys()].map(folderName))].map(x=>`<p>${esc(x)}</p>`).join('')}`)}function clearFolders(t){if(!confirm('Disconnect '+t+' files? Tags and playlists will remain.'))return;for(let k of [...files.keys()])if(t==='pdf'?isPDF(k):isMusic(k)){files.delete(k);if(db)db.transaction('files','readwrite').objectStore('files').delete(k)}if(t==='pdf')resetPDF();else{$('audio').pause();$('audio').removeAttribute('src')}loadRelease();settings()}async function clearCache(){if('caches'in window)for(let k of await caches.keys())if(k.startsWith('choreo-v1'))await caches.delete(k);alert('Temporary app cache cleared. Saved data and folders retained.')}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='choreography-v1-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}$('restore').onchange=async()=>{try{let s=JSON.parse(await $('restore').files[0].text());if(!s.tags||!s.playlists||!s.releases)throw Error('Not a V1 backup');if(confirm('Replace saved settings and playlists with this backup?')){state=s;save();init();loadRelease();closeDialog()}}catch(e){alert(e.message)}};
async function printPages(){if(!doc)return;let w=window.open('','_blank');if(!w)return alert('Allow popups to print.');w.document.write('<title>Choreography print</title><style>img{width:100%;break-after:page}</style>');let targets=activePlaylist?queue.flatMap(k=>{let t=state.tags[k];return t?t.pages.map(p=>[t.pdf,p]):[]}):[[pdfKey,page]];if(!targets.length)targets=[[pdfKey,page]];for(let [k,n] of targets){if(!files.has(k))continue;let d=k===pdfKey?doc:await pdfjs.getDocument({data:await files.get(k).file.arrayBuffer()}).promise;let p=await d.getPage(n),v=p.getViewport({scale:1.8}),c=document.createElement('canvas');c.width=v.width;c.height=v.height;await p.render({canvasContext:c.getContext('2d'),viewport:v}).promise;let im=w.document.createElement('img');im.src=c.toDataURL();w.document.body.append(im)}w.document.close();setTimeout(()=>w.print(),500)}
expose({settings,closeDialog,mode,browseMusic,step,thumbnails,choosePDF,tag,zoom,full,movePage,printPages,planner,library,selectSong,songMenu,jump,linkPDF,filterGroups,linkGroup,saveTag,addToPlaylist,newPlaylist,editPlaylist,reorder,removeSong,addRelease,deletePlaylist,addFolder,clearFolders,clearCache,backup});init();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
