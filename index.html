const dataKey='choreo-v1', historyKey='choreo-v1-recovery'; function parse(raw,fallback){try{return JSON.parse(raw)||fallback}catch{return fallback}} function valuable(s){return ['tags','playlists','releases','songReleases'].some(k=>Object.keys(s?.[k]||{}).length)} let state=parse(localStorage.getItem(dataKey),{}); if(!valuable(state)){let h=parse(localStorage.getItem(historyKey),[]);if(h.some(x=>valuable(x.state)))state=h.find(x=>valuable(x.state)).state;} state.tags??={};state.songReleases??={};state.playlists??={};state.releases??={};state.mode??='folder';let files=new Map(),db,doc=null,pdfKey='',page=1,scale=1,queue=[],current=-1,activePlaylist='',renderTask,renderSeq=0,loadSeq=0,audioURL='',kind='music';const programs=['BODYPUMP','BODYCOMBAT','BODYBALANCE','BODYJAM','BODYSTEP','BODYATTACK','RPM','SPRINT','GRIT','CORE','TONE','DANCE','STRENGTH DEVELOPMENT','BODYPUMP HEAVY','REFORMER'];

function init(){ $('program').innerHTML=programs.map(p=>opt(p)).join('');$('release').innerHTML=Array.from({length:200},(_,i)=>opt(i+1,'Release '+(i+1))).join('');$('program').value=state.program||'BODYCOMBAT';$('release').value=state.release||'108';updatePlaylists();$('program').onchange=$('release').onchange=()=>{activePlaylist='';$('playlist').value='';loadRelease()};$('playlist').onchange=()=>{activePlaylist=$('playlist').value;if(activePlaylist){queue=[...(state.playlists[activePlaylist]||[])];current=-1;refreshSongs(false);if(queue.length)selectSong(0,false)}else loadRelease()};mode(state.mode,false)}

async function thumbnails(){if(!doc)return;let d=doc;show('PDF pages',`<div class=thumbs>${Array.from({length:d.numPages},(_,i)=>`<button onclick="jump(${i+1})"><canvas id="thumb${i+1}"></canvas>${i+1}</button>`).join('')}</div>`);for(let i=1;i<=d.numPages&&$('modal').open;i++){let c=$('thumb'+i);if(!c)break;let p=await d.getPage(i),v=p.getViewport({scale:100/p.getViewport({scale:1}).width});c.width=v.width;c.height=v.height;await p.render({canvasContext:c.getContext('2d'),viewport:v}).promise.catch(()=>{})}}function jump(p){page=p;closeDialog();render()}

function pickPlaylist(i,j){let n=j<0?$('playlistNew').value.trim():Object.keys(state.playlists)[j];if(!n||!queue[i])return;if(!Object.hasOwn(state.playlists,n))Object.defineProperty(state.playlists,n,{value:[],writable:true,enumerable:true,configurable:true});rememberSource(queue[i]);state.playlists[n].push(queue[i]);save();updatePlaylists();if(activePlaylist===n){queue=[...state.playlists[n]];refreshSongs(false)}closeDialog()}
function planner(){show('Playlist planner',`<div class=field><input id=newName placeholder="New playlist name"><button onclick="newPlaylist()">Create</button></div>`+Object.keys(state.playlists).map((n,i)=>`<div class=field><button onclick="editPlaylist(${i})">${esc(n)} · ${state.playlists[n].length} songs</button></div>`).join(''))}function newPlaylist(){let n=$('newName').value.trim();if(n){state.playlists[n]??=[];save();updatePlaylists();planner()}}function editPlaylist(i){let n=Object.keys(state.playlists)[i];window.editName=n;show(n,`<div class=field><button onclick="addRelease()">Add current release songs</button><button onclick="deletePlaylist()">Delete playlist</button></div>`+state.playlists[n].map((k,j)=>`<div class=song><span>${esc(files.get(k)?.title||base(k))}</span><button onclick="reorder(${j},-1)">↑</button><button onclick="reorder(${j},1)">↓</button><button onclick="removeSong(${j})">✕</button></div>`).join(''))}function editAgain(){if(activePlaylist===window.editName){let old=queue[current];queue=[...state.playlists[activePlaylist]];current=old?queue.indexOf(old):-1;refreshSongs(false)}editPlaylist(Object.keys(state.playlists).indexOf(window.editName))}function reorder(i,d){let a=state.playlists[window.editName],j=i+d;if(j>=0&&j<a.length){[a[i],a[j]]=[a[j],a[i]];save();editAgain()}}function removeSong(i){state.playlists[window.editName].splice(i,1);save();editAgain()}function addRelease(){queue.forEach(rememberSource);state.playlists[window.editName].push(...queue);save();editAgain()}function deletePlaylist(){if(confirm('Delete this playlist?')){delete state.playlists[window.editName];save();updatePlaylists();planner()}}
function library(){show('Library',`<p>${[...files.keys()].filter(isPDF).length} PDFs · ${[...files.keys()].filter(isMusic).length} songs · ${Object.keys(state.tags).length} tagged songs</p><div class=field><button onclick="choosePDF()">Link release PDF</button><button onclick="browseMusic()">Link release music</button><button onclick="settings()">Manage folders</button></div>`)}function settings(){show('Settings',`<h3>Music folders</h3><div class=field><button onclick="addFolder('music')">Add / rescan music folder</button><button onclick="clearFolders('music')">Clear music folders</button></div><h3>PDF folders</h3><div class=field><button onclick="addFolder('pdf')">Add / rescan PDF folder</button><button onclick="clearFolders('pdf')">Clear PDF folders</button></div><h3>Maintenance</h3><div class=field><button onclick="clearCache()">Clear temporary cache</button><button onclick="backup()">Export backup</button><button onclick="recovery()">Recovery snapshots</button><button onclick="protectStorage()">Protect browser storage</button><button onclick="document.getElementById('restore').click()">Restore backup</button></div><p class=muted>Folder files are copied into browser storage. Clearing folders removes these copies, not your original files or saved associations. Backups contain settings, tags and playlists, not media. Device syncing is not configured.</p><h3>Connected folders</h3>${[...new Set([...files.keys()].map(folderName))].map(x=>`<p>${esc(x)}</p>`).join('')}`)}function clearFolders(t){if(!confirm('Disconnect '+t+' files? Tags and playlists will remain.'))return;for(let k of [...files.keys()])if(t==='pdf'?isPDF(k):isMusic(k)){files.delete(k);if(db)db.transaction('files','readwrite').objectStore('files').delete(k)}if(t==='pdf')resetPDF();else{$('audio').pause();$('audio').removeAttribute('src')}loadRelease();settings()}async function clearCache(){if('caches'in window)for(let k of await caches.keys())if(k.startsWith('choreo-v1'))await caches.delete(k);alert('Temporary app cache cleared. Saved data and folders retained.')}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='choreography-backup-'+new Date().toISOString().replace(/[:.]/g,'-')+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}$('restore').onchange=async()=>{try{let s=JSON.parse(await $('restore').files[0].text());if(!s.tags||!s.playlists||!s.releases)throw Error('Not a V1 backup');if(confirm('Replace saved settings and playlists with this backup?')){state=s;state.songReleases??={};save();init();loadRelease();closeDialog()}}catch(e){alert(e.message)}};
async function printPages(){if(!doc)return;let w=window.open('','_blank');if(!w)return alert('Allow popups to print.');w.document.write('<title>Choreography print</title><style>img{width:100%;break-after:page}main:fullscreen,main.teaching{height:100dvh;width:100%;background:#17191e;grid-template-columns:minmax(180px,28%) minmax(0,1fr);padding:6px}main.teaching{position:fixed;inset:0;z-index:20}main:fullscreen #music,main.teaching #music{display:flex}main:fullscreen #music .bar,main.teaching #music .bar{padding:5px;flex-wrap:wrap}main:fullscreen #musicTitle,main.teaching #musicTitle{order:0}main:fullscreen #music > .bar:first-child,main.teaching #music > .bar:first-child{display:none}main:fullscreen #songs,main.teaching #songs{order:5}main:fullscreen #music audio,main.teaching #music audio{height:38px}main:fullscreen .song,main.teaching .song{padding:5px;font-size:13px}.order-buttons{display:flex;gap:3px}.order-buttons button{padding:4px 7px}.order-buttons button:disabled{opacity:.3;cursor:default}@media(max-width:650px) and (orientation:portrait){main:fullscreen,main.teaching{display:flex;flex-direction:column}main:fullscreen #viewer,main.teaching #viewer{flex:3}main:fullscreen #music,main.teaching #music{flex:2}}@media(max-width:650px) and (orientation:landscape){main:fullscreen,main.teaching{display:grid}main:fullscreen #viewer,main.teaching #viewer{order:0}} </style>');let targets=activePlaylist?queue.flatMap(k=>{let t=state.tags[k];return t?t.pages.map(p=>[t.pdf,p]):[]}):[[pdfKey,page]];if(!targets.length)targets=[[pdfKey,page]];for(let [k,n] of targets){if(!files.has(k))continue;let d=k===pdfKey?doc:await pdfjs.getDocument({data:await files.get(k).file.arrayBuffer()}).promise;let p=await d.getPage(n),v=p.getViewport({scale:1.8}),c=document.createElement('canvas');c.width=v.width;c.height=v.height;await p.render({canvasContext:c.getContext('2d'),viewport:v}).promise;let im=w.document.createElement('img');im.src=c.toDataURL();w.document.body.append(im)}w.document.close();setTimeout(()=>w.print(),500)}
expose({recovery,restorePoint,protectStorage,moveActive,pickSongPDF,settings,closeDialog,mode,browseMusic,step,thumbnails,choosePDF,tag,zoom,full,movePage,printPages,planner,library,selectSong,songMenu,jump,linkPDF,filterGroups,linkGroup,pickPlaylist,addToPlaylist,newPlaylist,editPlaylist,reorder,removeSong,addRelease,deletePlaylist,addFolder,clearFolders,clearCache,backup});init();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
